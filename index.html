    <style>

<body>

<div class="container">

</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCGcl_W8UTT0wXrR1GYCKgJMPfn2wGCPcQ", authDomain: "bydataku.firebaseapp.com", databaseURL: "https://bydataku-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bydataku", storageBucket: "bydataku.firebasestorage.app", messagingSenderId: "61981946278", appId: "1:61981946278:web:cf9af907aa677e298d9f67" };
    firebase.initializeApp(firebaseConfig); const database = firebase.database(); const dbRef = database.ref('data_laporan_tim'); const teamRef = database.ref('team_members'); const chatRef = database.ref('chat_messages');
    let globalDataArray = []; let teamMembers = []; let tabSaatIni = 'aktif'; let typingTimeout; let namaSaya = localStorage.getItem('loginNamaSaya') || ""; 
    
    let historiPerKartu = {};
    function initHistori(uid, teks) { if(!historiPerKartu[uid]) historiPerKartu[uid] = { masaLalu: [], sekarang: teks, masaDepan: [] }; }
    function undoTeks(btn) { let bx = btn.closest('.data-column').querySelector('.output-box'); let u = bx.getAttribute('data-uid'); let hs = historiPerKartu[u]; if(hs && hs.masaLalu.length > 0) { hs.masaDepan.push(hs.sekarang); let mundur = hs.masaLalu.pop(); hs.sekarang = mundur; bx.value = mundur; let ix = globalDataArray.findIndex(d => d.uid === u); if(ix !== -1) { globalDataArray[ix].text = mundur; simpanKeCloud(); } } else { tampilkanToast("Mentok Undo.", "#f59e0b"); } }
    function redoTeks(btn) { let bx = btn.closest('.data-column').querySelector('.output-box'); let u = bx.getAttribute('data-uid'); let hs = historiPerKartu[u]; if(hs && hs.masaDepan.length > 0) { hs.masaLalu.push(hs.sekarang); let maju = hs.masaDepan.pop(); hs.sekarang = maju; bx.value = maju; let ix = globalDataArray.findIndex(d => d.uid === u); if(ix !== -1) { globalDataArray[ix].text = maju; simpanKeCloud(); } } else { tampilkanToast("Mentok Redo.", "#f59e0b"); } }

    const dbNIK={"3171":"KOTA JAKARTA SELATAN","3172":"KOTA JAKARTA TIMUR","3201":"KABUPATEN BOGOR","3204":"KABUPATEN BANDUNG","3273":"KOTA BANDUNG"};
    const petaProvinsi={"JAWA BARAT":["BANDUNG","BOGOR","BEKASI"],"DKI JAKARTA":["JAKARTA"]};

    let isChatOpen = false; let lastMsgCount = 0;
    function toggleChat() { isChatOpen = !isChatOpen; document.getElementById('chatBox').style.display = isChatOpen ? 'flex' : 'none'; let btn = document.getElementById('chatToggleBtn'); btn.innerText = '💬 Lapor ke Admin'; if(isChatOpen) { let cm = document.getElementById('chatMessages'); cm.scrollTop = cm.scrollHeight; } }
    function kirimPesan() { let txt = document.getElementById('chatInput').value.trim(); if(!txt) return; chatRef.push({ sender: namaSaya, text: txt, time: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) }); document.getElementById('chatInput').value = ''; }
    chatRef.on('value', snap => { let cm = document.getElementById('chatMessages'); cm.innerHTML = ''; let data = snap.val(); if(data && namaSaya) { let msgs = Object.values(data); msgs.forEach(msg => { let isMine = (msg.sender === namaSaya); let msgClass = isMine ? 'msg-mine' : (msg.sender === "Admin 👑" ? 'msg-admin' : 'msg-other'); let div = document.createElement('div'); div.className = `msg-item ${msgClass}`; div.innerHTML = `<div class="msg-sender">${msg.sender} • ${msg.time}</div><div>${msg.text}</div>`; cm.appendChild(div); }); cm.scrollTop = cm.scrollHeight; if(msgs.length > lastMsgCount && !isChatOpen && lastMsgCount !== 0) { let btn = document.getElementById('chatToggleBtn'); btn.innerText = '💬 Pesan Baru!'; } lastMsgCount = msgs.length; } else { lastMsgCount = 0; } });

    dbRef.on('value', snap => { document.getElementById('cloudStatus').innerText="🟢 Sinkronisasi Aktif"; document.getElementById('cloudStatus').classList.add('online'); let dataBaru = snap.val() || []; let el = document.activeElement; let lagiNgetik = el && el.classList.contains('output-box'); if (lagiNgetik) { let uidEdit = el.getAttribute('data-uid'); globalDataArray = dataBaru.map(item => { if(item.uid === uidEdit) item.text = el.value; return item; }); } else { globalDataArray = dataBaru; eksekusiPengurutanLaluRender(); } });
    teamRef.on('value', snap => { teamMembers=snap.val()||[]; if(namaSaya && teamMembers.includes(namaSaya)) { document.getElementById('myIdentity').value = namaSaya; loginSistem(true); } });

    function simpanKeCloud() { dbRef.set(globalDataArray); }
    function generateUID() { return Date.now().toString(36)+Math.random().toString(36).substr(2); }

    function handleEnter(e) { if(e.key === 'Enter') loginSistem(); }
    function loginSistem(isAuto = false) { let inputNama = document.getElementById('myIdentity').value.trim(); if(!inputNama) return; let namaValid = teamMembers.find(m => m.toLowerCase() === inputNama.toLowerCase()); if(namaValid) { namaSaya = namaValid; localStorage.setItem('loginNamaSaya', namaSaya); document.getElementById('loginGate').style.display = 'none'; document.getElementById('mainWorkspace').style.display = 'block'; document.getElementById('userGreeting').innerHTML = `Selamat Bekerja, <b>${namaSaya}</b>!`; eksekusiPengurutanLaluRender(); document.getElementById('chatToggleBtn').style.display = 'block'; if(!isAuto) tampilkanToast(`Berhasil Masuk: ${namaSaya}`, "#4f46e5"); } else { if(!isAuto) { alert(`⚠️ DITOLAK!\nNama "${inputNama}" tidak terdaftar.`); document.getElementById('myIdentity').value = ''; document.getElementById('myIdentity').focus(); } } }
    function logoutSistem() { namaSaya = ""; localStorage.removeItem('loginNamaSaya'); document.getElementById('loginGate').style.display = 'block'; document.getElementById('mainWorkspace').style.display = 'none'; document.getElementById('myIdentity').value = ""; document.getElementById('userGreeting').innerText = "Workspace Premium Harian"; document.getElementById('chatToggleBtn').style.display = 'none'; document.getElementById('chatBox').style.display = 'none'; }

    function tebakProvinsi(kab) { kab=kab.toUpperCase().trim(); for(let p in petaProvinsi){ if(petaProvinsi[p].some(k=>kab.includes(k))) return p; } return kab; }
    function kurangiSatuBulan(dt) { if(!dt) return""; let p=dt.split('-'); if(p.length!==3) return dt; let d=p[0], m=parseInt(p[1],10), y=parseInt(p[2],10); m-=1; if(m===0){m=12;y-=1;} return `${d}-${m<10?'0'+m:m}-${y}`; }
    function bentukTeksAkhir(dt, cIdx) { let sc=parseInt(dt.status,10); let hd=(sc>=2&&sc<=20)?`SENSOR JMO OK\nGLOBAL ${dt.amount}`:(sc===1?`TUNGGAL\n${dt.amount}`:`STATUS_${dt.status}\n${dt.amount}`); let em=dt.email?`${dt.email}\n`:''; return {uid:generateUID(), index:cIdx, status:dt.status, nama:dt.nama, nik:dt.nik, provinsi:dt.provinsi, company:dt.company.toUpperCase().trim(), amount:dt.amount, done:false, deleted:false, selected:true, assignedTo:"", text:`${dt.wilayah}\n\n${dt.nik}\n${dt.gender}\n${dt.tglLahir}\n\n${hd}\n${dt.company}\nN/A ${dt.endDate}\n\n${em}Qwer123@\n${dt.id1}\n${dt.nama}`}; }
    
    function prosesTextMentah(inputStr, idx) { 
        let ra=[]; let pTxt=inputStr; const rgx=/(\d{16})\s*\n(.+?)\s*\n(.*?)\s*\|\s*(\d{2}-\d{2}-\d{4})\s*\n(?:JUMLAH KPJ:\s*)?(\d+)\s*\n(\d+)\s*\n(.+?)\s*\n(\d{2}-\d{2}-\d{4})\s*\nTOTAL SALDO\s*:\s*(?:Rp)?\s*([\d\.]+)(?:\s*\nJMO)?/gi; let m; let lI=0; 
        while((m=rgx.exec(inputStr))!==null){ 
            let txtS=inputStr.substring(lI,m.index).replace(/\[.*?\]\s*.*?:\s*/g,''); let barS=txtS.split('\n').map(b=>b.trim()).filter(b=>b.length>0); let kA=barS.slice(-4); let aG=kA.join(', '); let wF=kA.length>0?`*${kA.join(', ')}*`:`*Alamat Kosong*`; ra.push(bentukTeksAkhir({wilayah:wF, provinsi:"", nik:m[1].trim(), nama:m[2].trim(), gender:(m[3].toUpperCase().includes('L')||m[3].toUpperCase().includes('PRIA'))?'PRIA':'WANITA', tglLahir:m[4].trim(), status:m[5].trim(), id1:m[6].trim(), company:m[7].trim(), endDate:kurangiSatuBulan(m[8].trim()), amount:parseInt(m[9].trim().replace(/\./g,'')||"0",10).toLocaleString('id-ID'), email:""}, idx++)); lI=rgx.lastIndex; pTxt=pTxt.replace(m[0],' '.repeat(m[0].length)); 
        } 
        let lns=pTxt.split('\n'); 
        for(let i=0;i<lns.length;i++){ 
            let cL=lns[i].replace(/^\[.*?\] .*?:\s*/,'').trim(); if(!cL)continue; 
            let c=cL.split('\t').map(x=>x.trim()).filter(x=>x!==''); 
            
            if(c.length>=12 && /^\d{2}-\d{2}-\d{4}$/.test(c[4]) && (c[5].toUpperCase()==='L' || c[5].toUpperCase()==='P' || c[5].toUpperCase()==='PRIA' || c[5].toUpperCase()==='WANITA')){ 
                ra.push(bentukTeksAkhir({id1:c[1], nik:c[2], nama:c[3], tglLahir:c[4], gender:(c[5]?.toUpperCase()==='L' || c[5]?.toUpperCase()==='PRIA')?'PRIA':'WANITA', status:c[6], amount:parseInt(c[7]||"0",10).toLocaleString('id-ID'), company:c[8], endDate:kurangiSatuBulan(c[10]), wilayah:`*${c[11]}, ${c[12]}, ${c[13]}*`, provinsi:tebakProvinsi(c[11]), email:""}, idx++)); 
            } 
            else if (c.length >= 7 && c[2] && c[2].length === 16) {
                let id1 = c[0]; let nama = c[1]; let nik = c[2]; let tglLahir = c[3]; let alamatRaw = c[4];
                let company = "N/A"; let endDate = ""; let amount = "0"; let status = "0";
                if (/^\d{2}-\d{2}-\d{4}$/.test(c[5])) { endDate = c[5]; amount = c[6]; status = c[7]; } 
                else if (/^\d{2}-\d{2}-\d{4}$/.test(c[6])) { company = c[5]; endDate = c[6]; amount = c[7]; status = c[8]; }
                let gen = "PRIA"; if (parseInt(nik.substring(6,8), 10) > 40) gen = "WANITA";
                let amtStr = (amount || "0").replace(/Rp\s*/i,'').replace(/\./g,'').trim();
                let amt = parseInt(amtStr||"0", 10).toLocaleString('id-ID');
                let nmK = dbNIK[nik.substring(0,4)] || "Kab. Tidak Ditemukan";
                let aB = alamatRaw.replace(/\b(Kabupaten|Kota|Kecamatan|Kelurahan|Desa)\b\s*[:\-]?\s*|\b(Kab|Kec|Kel)\b\.?\s*[:\-]?\s*/gi,'').replace(/,\s*,/g,',').replace(/^,\s*/,'').trim();
                let wF = /\b(kabupaten|kota|kab)\b/i.test(alamatRaw) ? `*${aB}*` : `*${nmK}, ${aB}*`;
                let pF = tebakProvinsi(wF.split(',')[0]);
                ra.push(bentukTeksAkhir({ id1: id1, nik: nik, nama: nama, tglLahir: tglLahir, gender: gen, status: status, amount: amt, company: company, endDate: kurangiSatuBulan(endDate), wilayah: wF, provinsi: pF, email: "" }, idx++));
            }
            else { 
                let mt=cL.match(/^(\d+)\s+(\d+)\s+(\d+)\s+(.*?)\s+(\d{2}-\d{2}-\d{4})\s*(L|P|l|p)\s*(\d+)\s+(\d+)\s+(.*?)\s+(\d{2}-\d{2}-\d{4})\s+(\d{2}-\d{2}-\d{4})\s+(.*?)(?:\s+success)?$/i); 
                if(mt){ let wR=mt[12]; ra.push(bentukTeksAkhir({id1:mt[2], nik:mt[3], nama:mt[4], tglLahir:mt[5], gender:mt[6].toUpperCase()==='L'?'PRIA':'WANITA', status:mt[7], amount:parseInt(mt[8]||"0",10).toLocaleString('id-ID'), company:mt[9], endDate:kurangiSatuBulan(mt[11]), wilayah:wR.includes('  ')?`*${wR.replace(/\s{2,}/g,', ')}*`:`*${wR}*`, provinsi:tebakProvinsi(wR.split(/[, ]+/)[0]), email:""}, idx++)); } 
            } 
        } 
        return ra; 
    }

    function tambahKeAntrean() { let inpt=document.getElementById('inputData').value; if(!inpt.trim())return alert("Kosong!"); let iT=-1; globalDataArray.forEach(i=>{if(i.index>iT)iT=i.index;}); let aT=prosesTextMentah(inpt,iT+1); if(aT.length===0)return alert("Gagal!"); aT.forEach(d => d.assignedTo = namaSaya); globalDataArray=globalDataArray.concat(aT); simpanKeCloud(); document.getElementById('inputData').value=''; document.getElementById('inputDarurat').style.display='none'; gantiTab('aktif'); tampilkanToast(`✔️ Data disisipkan.`, "#10b981"); }
    function eksekusiPengurutanLaluRender() { let arr=[...globalDataArray]; arr.sort((a,b)=>a.index-b.index); buatElemenKolom(arr); saringKartuLaporan(); }
    
    function buatElemenKolom(arr) { 
        if(!namaSaya) return; 
        const wA=document.getElementById('wrapperAktif'); const wS=document.getElementById('wrapperSelesai'); const wD=document.getElementById('wrapperSampah'); wA.innerHTML=''; wS.innerHTML=''; wD.innerHTML=''; let hN={}; arr.forEach(i=>{ if(i.nik&&!i.deleted)hN[i.nik]=(hN[i.nik]||0)+1; }); let jA=0, jS=0, jD=0; 
        arr.forEach(i=>{ 
            if(i.assignedTo !== namaSaya) return; 
            initHistori(i.uid, i.text);
            const dv=document.createElement('div'); let isD=(!i.deleted&&i.nik&&hN[i.nik]>1); dv.className=i.deleted?'data-column is-deleted':(i.done?'data-column is-done':(isD?'data-column is-duplicate':'data-column')); let tc=(parseInt(i.status,10)>=2&&parseInt(i.status,10)<=20)?'title-global':'title-tunggal';
            let ah=``; if(!i.deleted){ah=`<div class="assign-box">✔️ Milik Anda</div>`;}
            let ac=i.deleted?`<div class="card-actions"><button class="btn btn-blue" onclick="rubahStatusSampah(this,'kembalikan')">↩ Restore</button></div>`:`${isD?`<div class="duplicate-msg">⚠️ PERINGATAN NIK GANDA</div>`:''}<div class="mass-check-row"><input type="checkbox" class="send-queue-check" ${i.selected?'checked':''} onchange="perbaruiCheckbox(this)"> 📌 Tandai Antrean</div><div class="card-actions"><button class="btn btn-green" onclick="salinSatuKolom(this)">📋 Salin</button><button class="btn ${i.done?'btn-status-undone':'btn-status-done'}" onclick="toggleTandaiSelesai(this)">${i.done?'↩ Batal':'✔️ Selesai'}</button><button class="btn btn-red" style="flex:0.3" onclick="rubahStatusSampah(this,'buang')" title="Laporkan/Buang ke Sampah">🗑️</button></div>`;
            dv.innerHTML=`<div class="col-title ${tc}">DATA KOLOM ${i.index+1}</div>${ah}${ac}<textarea class="output-box" placeholder="Ketik di sini untuk mengoreksi..." data-uid="${i.uid}">${i.text}</textarea><div class="edit-toolbar"><button onclick="undoTeks(this)">↺ Undo</button><button onclick="redoTeks(this)">↻ Redo</button></div>`;
            if(i.deleted){wD.appendChild(dv);jD++;}else if(i.done){wS.appendChild(dv);jS++;}else{wA.appendChild(dv);jA++;}
        }); document.getElementById('hitungAktif').innerText=jA; document.getElementById('hitungSelesai').innerText=jS; document.getElementById('hitungSampah').innerText=jD;
        
        document.querySelectorAll('.output-box').forEach(bx=>{ 
            bx.addEventListener('input', function(){ 
                let u=this.getAttribute('data-uid'); let v=this.value; let ix=globalDataArray.findIndex(d=>d.uid===u); if(ix!==-1)globalDataArray[ix].text=v; 
                let hs = historiPerKartu[u]; if(hs && hs.sekarang !== v) { hs.masaLalu.push(hs.sekarang); if(hs.masaLalu.length > 40) hs.masaLalu.shift(); hs.sekarang = v; hs.masaDepan = []; }
                clearTimeout(typingTimeout); typingTimeout=setTimeout(()=>{simpanKeCloud();},1000); 
            }); 
            bx.addEventListener('blur', function() { eksekusiPengurutanLaluRender(); });
        });
    }
    
    function saringKartuLaporan() { const kw=document.getElementById('searchFilter').value.toLowerCase(); document.querySelectorAll('.data-column').forEach(k=>{ const bx=k.querySelector('.output-box'); let lt=bx.value.toLowerCase().includes(kw); k.style.display=(lt)?'inline-block':'none'; }); }
    function gantiTab(tb) { tabSaatIni=tb; document.querySelectorAll('.tab-btn').forEach(b=>b.className='tab-btn'); document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); document.getElementById('tabBtn'+tb.charAt(0).toUpperCase()+tb.slice(1)).classList.add('active-tab-'+tb); document.getElementById('zona'+tb.charAt(0).toUpperCase()+tb.slice(1)).classList.add('active'); eksekusiPengurutanLaluRender(); }
    function toggleTandaiSelesai(b) { let u=b.closest('.data-column').querySelector('.output-box').getAttribute('data-uid'); let i=globalDataArray.findIndex(d=>d.uid===u); if(i!==-1){globalDataArray[i].done=!globalDataArray[i].done;simpanKeCloud();} }
    function rubahStatusSampah(b,p) { let u=b.closest('.data-column').querySelector('.output-box').getAttribute('data-uid'); let i=globalDataArray.findIndex(d=>d.uid===u); if(i!==-1){ if(p==='buang'){globalDataArray[i].deleted=true;globalDataArray[i].done=false;globalDataArray[i].selected=false;} else if(p==='kembalikan'){globalDataArray[i].deleted=false;} simpanKeCloud(); } }
    function perbaruiCheckbox(c) { let u=c.closest('.data-column').querySelector('.output-box').getAttribute('data-uid'); let i=globalDataArray.findIndex(d=>d.uid===u); if(i!==-1){globalDataArray[i].selected=c.checked;simpanKeCloud();} }
    function tampilkanToast(m,c) { let t=document.getElementById('toastNotif'); t.innerText=m; t.style.background=c; t.style.display='block'; setTimeout(()=>t.style.display='none',3500); }
    function salinTeksAman(txt,s) { let dm=document.createElement('textarea'); dm.value=txt; dm.style.position='absolute'; dm.style.left='-9999px'; document.body.appendChild(dm); dm.select(); document.execCommand('copy'); document.body.removeChild(dm); if(s)s(); }
    function salinAntreanSelanjutnya() { let an=document.querySelectorAll('.tab-content.active .send-queue-check:checked'); if(an.length===0)return tampilkanToast("⚠️ Antrean habis!", "#ef4444"); let c=an[0].closest('.data-column'); let t=c.querySelector('.output-box'); if(!t.value)return; salinTeksAman(t.value,()=>{ tampilkanToast(`✔️ Tersalin!`, "#10b981"); let i=globalDataArray.findIndex(d=>d.uid===t.getAttribute('data-uid')); if(i!==-1){globalDataArray[i].selected=false;globalDataArray[i].done=true;simpanKeCloud();} }); }
    function salinSatuKolom(b) { let t=b.closest('.data-column').querySelector('.output-box'); if(!t.value)return; salinTeksAman(t.value,()=>{ let l=b.innerText; b.innerText='✔️'; setTimeout(()=>b.innerText=l,1500); }); }
</script>
